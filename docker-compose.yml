services:
  discord-gateway:
    build: ./discord-gateway
    ports:
      - "127.0.0.1:3023:3023"
    env_file:
      - ./discord-gateway/.env
    restart: unless-stopped

  slack-gateway:
    build: ./slack-gateway
    ports:
      - "127.0.0.1:3022:3022"
    env_file:
      - ./slack-gateway/.env
    restart: unless-stopped

  google-chat-gateway:
    build: ./google-chat-gateway
    ports:
      - "127.0.0.1:3024:3024"
    env_file:
      - ./google-chat-gateway/.env
    restart: unless-stopped

  lark-gateway:
    build:
      context: ./lark-gateway
      args:
        GATEWAY_UID: ${LARK_GATEWAY_UID:-1000}
        GATEWAY_GID: ${LARK_GATEWAY_GID:-1000}
    ports:
      - "127.0.0.1:3025:3025"
    env_file:
      - ./lark-gateway/.env
    volumes:
      - ${HOME}/.agent-messaging:/home/gateway/.agent-messaging
      - ./lark-gateway/config:/app/config:ro
      - ./lark-gateway/data:/app/data
    environment:
      LARK_ROUTING_FILE: /app/config/routing.yaml
    restart: unless-stopped

  email-gateway:
    build: ./email-gateway
    ports:
      - "127.0.0.1:3020:3020"
    env_file:
      - ./email-gateway/.env
    restart: unless-stopped

  whatsapp-gateway:
    build: ./whatsapp-gateway
    ports:
      - "127.0.0.1:3021:3021"
    env_file:
      - ./whatsapp-gateway/.env
    restart: unless-stopped
